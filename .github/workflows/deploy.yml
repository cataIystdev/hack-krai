name: Deploy KudyPut Workflow

on:
  push:
    branches:
      - prod
      - dev
      - test-catalyst
      - test-lowcoware

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          REPO_URL: "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: BRANCH_NAME, REPO_URL
          command_timeout: 45m
          script: |
            set -xe # Включаем подробное логирование каждой команды и прерывание при ошибках
            export ENV_NAME=$BRANCH_NAME
            export DEPLOY_DIR=/opt/deepkrai/$ENV_NAME
            export CONFIG_DIR=/opt/deepkrai/configs
            export SHARED_DIR=/opt/deepkrai/shared

            echo "Deploying branch: $ENV_NAME to $DEPLOY_DIR"

            # 1. Ensure deployment directory exists
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR

            # 2. Clone repository if not existing using init (works even if dir is not empty)
            if [ ! -d ".git" ]; then
              echo "Initializing git repository..."
              git init
            fi

            # Убеждаемся, что remote URL обновлен свежим токеном авторизации
            git remote set-url origin $REPO_URL || git remote add origin $REPO_URL

            # 3. Update from git repository
            git fetch origin
            git checkout -f $ENV_NAME || git checkout -b $ENV_NAME origin/$ENV_NAME
            git reset --hard origin/$ENV_NAME

            # 4. Apply environment configuration
            if [ -f "$CONFIG_DIR/.env.$ENV_NAME" ]; then
              cp "$CONFIG_DIR/.env.$ENV_NAME" $DEPLOY_DIR/.env
              
              # Создаём отдельный .env.api с внутренними Docker-портами для API
              # Оригинальный .env НЕ трогаем — он используется docker-compose для внешних портов
              cp $DEPLOY_DIR/.env $DEPLOY_DIR/.env.api
              sed -i 's/POSTGRES_HOST=.*/POSTGRES_HOST=postgres/' $DEPLOY_DIR/.env.api
              sed -i 's/POSTGRES_PORT=.*/POSTGRES_PORT=5432/' $DEPLOY_DIR/.env.api
              sed -i 's/REDIS_HOST=.*/REDIS_HOST=redis/' $DEPLOY_DIR/.env.api
              sed -i 's/REDIS_PORT=.*/REDIS_PORT=6379/' $DEPLOY_DIR/.env.api
              sed -i 's/QDRANT_HOST=.*/QDRANT_HOST=qdrant/' $DEPLOY_DIR/.env.api
              sed -i 's/QDRANT_HTTP_PORT=.*/QDRANT_HTTP_PORT=6333/' $DEPLOY_DIR/.env.api
              sed -i 's/QDRANT_GRPC_PORT=.*/QDRANT_GRPC_PORT=6334/' $DEPLOY_DIR/.env.api
              sed -i 's/NEO4J_HOST=.*/NEO4J_HOST=neo4j/' $DEPLOY_DIR/.env.api
              sed -i 's/NEO4J_BOLT_PORT=.*/NEO4J_BOLT_PORT=7687/' $DEPLOY_DIR/.env.api
              sed -i 's/NEO4J_HTTP_PORT=.*/NEO4J_HTTP_PORT=7474/' $DEPLOY_DIR/.env.api
              sed -i 's/CLICKHOUSE_HOST=.*/CLICKHOUSE_HOST=clickhouse/' $DEPLOY_DIR/.env.api
              sed -i 's/CLICKHOUSE_PORT=.*/CLICKHOUSE_PORT=9000/' $DEPLOY_DIR/.env.api
              sed -i 's/CLICKHOUSE_HTTP_PORT=.*/CLICKHOUSE_HTTP_PORT=8123/' $DEPLOY_DIR/.env.api
              sed -i 's/MINIO_HOST=.*/MINIO_HOST=minio/' $DEPLOY_DIR/.env.api
              sed -i 's/MINIO_API_PORT=.*/MINIO_API_PORT=9000/' $DEPLOY_DIR/.env.api
              sed -i 's/MINIO_CONSOLE_PORT=.*/MINIO_CONSOLE_PORT=9001/' $DEPLOY_DIR/.env.api
              # Vosk в shared сети — имя контейнера: deepkrai-shared-vosk-1
              sed -i 's/VOSK_HOST=.*/VOSK_HOST=vosk/' $DEPLOY_DIR/.env.api
              sed -i 's/VOSK_PORT=.*/VOSK_PORT=2700/' $DEPLOY_DIR/.env.api
              sed -i 's|AI_EMBEDDINGS_BASE_URL=.*|AI_EMBEDDINGS_BASE_URL=http://embeddings-server:7997/|' $DEPLOY_DIR/.env.api
              
              echo "✅ Configuration .env.$ENV_NAME applied and adapted for Docker successfully."
            else
              echo "⚠️ WARNING: Environment file $CONFIG_DIR/.env.$ENV_NAME not found."
            fi

            # 5. Deploy shared services (Vosk STT) — один на все окружения.
            # Копируем shared files в общую директорию.
            mkdir -p $SHARED_DIR/vosk
            cp $DEPLOY_DIR/docker-compose.shared.yml $SHARED_DIR/docker-compose.shared.yml
            cp $DEPLOY_DIR/vosk/asr_server.py $SHARED_DIR/vosk/asr_server.py

            # Поднимаем shared services (если уже запущены — обновляем).
            cd $SHARED_DIR
            docker compose -f docker-compose.shared.yml --project-name deepkrai-shared up -d
            cd $DEPLOY_DIR

            # Ждём пока Vosk загрузит модель (healthcheck по TCP 2700).
            echo "⏳ Waiting for Vosk STT to become healthy..."
            for i in $(seq 1 24); do
              VOSK_STATUS=$(docker inspect --format='{{.State.Health.Status}}' deepkrai-shared-vosk-1 2>/dev/null || echo "not_found")
              echo "  [… $((i*5))s] vosk=$VOSK_STATUS"
              if [ "$VOSK_STATUS" = "healthy" ]; then
                echo "✅ Vosk STT is healthy!"
                break
              fi
              sleep 5
            done

            # 6. Stop old containers to free ports, then start fresh
            docker compose --project-name deepkrai-$ENV_NAME down --remove-orphans || true
            docker compose --project-name deepkrai-$ENV_NAME up -d --build

            # 7. Wait for slow-starting services (Neo4j needs ~80s)
            echo "⏳ Waiting for all databases to become healthy..."
            for i in $(seq 1 24); do
              NEO4J_STATUS=$(docker inspect --format='{{.State.Health.Status}}' deepkrai-${ENV_NAME}-neo4j-1 2>/dev/null || echo "not_found")
              CH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' deepkrai-${ENV_NAME}-clickhouse-1 2>/dev/null || echo "not_found")
              echo "  [… $((i*5))s] neo4j=$NEO4J_STATUS clickhouse=$CH_STATUS"
              if [ "$NEO4J_STATUS" = "healthy" ] && [ "$CH_STATUS" = "healthy" ]; then
                echo "✅ All databases are healthy!"
                break
              fi
              sleep 5
            done

            # 8. Restart API so it reconnects to all now-healthy databases
            echo "🔄 Restarting API to reconnect to all databases..."
            docker compose --project-name deepkrai-$ENV_NAME restart api
            sleep 10

            # 9. Diagnostics
            echo "=== CONTAINER STATUS ==="
            docker compose --project-name deepkrai-$ENV_NAME ps
            echo "=== SHARED SERVICES ==="
            docker ps --format '{{.Names}} {{.Status}}' | grep shared || true
            echo "=== API CONTAINER LOGS (last 50 lines) ==="
            docker compose --project-name deepkrai-$ENV_NAME logs --tail=50 api
            echo "=== HEALTH CHECK ==="
            curl -sf http://localhost:$(grep '^APP_PORT=' $DEPLOY_DIR/.env.api | cut -d= -f2 || echo 8080)/api/v1/health && echo "\n✅ API is healthy!" || echo "❌ API health check failed!"

            echo "🎉 Deployment of $ENV_NAME complete."
