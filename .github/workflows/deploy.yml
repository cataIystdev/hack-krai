name: Deploy KudyPut Workflow

on:
  push:
    branches:
      - prod
      - dev
      - test-catalyst
      - test-lowcoware

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: BRANCH_NAME, REPO_URL
          script: |
            export ENV_NAME=$BRANCH_NAME
            export DEPLOY_DIR=/opt/deepkrai/$ENV_NAME
            export CONFIG_DIR=/opt/deepkrai/configs

            echo "Deploying branch: $ENV_NAME to $DEPLOY_DIR"

            # 1. Ensure deployment directory exists
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR

            # 2. Clone repository if not existing
            if [ ! -d ".git" ]; then
              git clone $REPO_URL .
            fi

            # 3. Update from git repository
            git fetch origin
            git checkout $ENV_NAME
            git reset --hard origin/$ENV_NAME

            # 4. Apply environment configuration
            if [ -f "$CONFIG_DIR/.env.$ENV_NAME" ]; then
              cp "$CONFIG_DIR/.env.$ENV_NAME" $DEPLOY_DIR/.env
              echo "✅ Configuration .env.$ENV_NAME applied successfully."
            else
              echo "⚠️ WARNING: Environment file $CONFIG_DIR/.env.$ENV_NAME not found."
            fi

            # 5. Restart Infrastructure services (Databases, Vosk, Qdrant)
            # Using specific project name to avoid container collision
            docker compose --project-name deepkrai-$ENV_NAME up -d --build

            # 6. Build the Go API 
            echo "🔨 Building Go API..."
            cd api
            # Make sure go is available on the target environment or use a specific path
            export CGO_ENABLED=0 GOOS=linux GOARCH=amd64
            # Attempt to build, if go command not found, warn
            if command -v go &> /dev/null; then
              go build -o api_bin cmd/api/main.go
              echo "✅ Go API built successfully."
              # 7. Restart the systemd service for the API
              systemctl restart deepkrai-api@$ENV_NAME || echo "⚠️ Service restart failed. Service might not be configured yet."
            else
              echo "❌ Go is not installed on the server or not in PATH. Skipping Go API build."
            fi
            echo "🎉 Deployment of $ENV_NAME complete."
